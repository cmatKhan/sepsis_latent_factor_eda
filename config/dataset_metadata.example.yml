# Example dataset_metadata.yml.
#
# Describes ONE dataset run against ONE input matrix, resolved one of three
# ways (first match wins -- see R/README.md's "Preparing your input matrix"):
#   1. dataset.matrix_path is set               -> read that RDS matrix as-is.
#   2. dataset.preprocessing_script is set      -> run your script against
#                                                   the raw parquet trio.
#   3. neither is set                           -> pivot dataset.expression_path
#                                                   (long format) wide, no
#                                                   other transformation.
#
# There's no post-hoc sample/feature filtering step: if a matrix needs
# restricting to a subset, do it inside a preprocessing_script (mode 2) or
# bake it into the matrix itself (mode 1).
#
# If you want to run several subsets separately (e.g. per timepoint, per
# tissue), write one dataset_metadata.yml per matrix/script and run
# `Rscript R/create_slurm_bundle.R <this file>` once per file -- there's no
# built-in "multiple matrices in one config" concept.
#
# `slurm:` (SLURM resource settings, formerly a separate cluster_config.yml
# -- merged in here so different datasets can use different resources) and
# `methods:` both live in this same file. See R/README.md's config
# reference for the full field-by-field explanation, including the
# tool-argument-name convention and worked examples for every method.

dataset:
  id: sepsis_day0                                    # unique per matrix/run
  description: >
    Whole-blood RNA-seq, Day 0 samples only, from a sepsis cohort deposited
    as a HuggingFace collection (long-format expression + sample metadata +
    feature metadata parquet trio).
  hf_collection: "org/sepsis-timecourse-rnaseq"       # documentation only

  # Mode 1: uncomment to use an already-built matrix directly, skipping
  # both the raw parquet trio and any preprocessing_script.
  # matrix_path: results/matrices/sepsis_day0.rds

  # Raw parquet trio -- always recorded for provenance. Required for
  # resolution mode 3 (default pivot); passed through to your script
  # unchanged for mode 2 (preprocessing_script). Also used by the stage-2
  # stability app's metadata drill-down.
  expression_path: data/raw/expression.parquet
  sample_metadata_path: data/raw/sample_metadata.parquet
  feature_metadata_path: data/raw/feature_metadata.parquet
  sample_id_col: sample_id
  feature_id_col: feature_id
  value_col: value

  # THE canonical cross-dataset identifier for all COMPUTATIONAL work
  # (fgsea_grid/projectr_*_grid; see R/lib/ingest/
  # symbol_mapping.R::build_ensembl_map()/remap_to_ensembl()) -- names
  # the feature_metadata_path column holding this dataset's Ensembl gene
  # id. Every dataset's matrix rownames get remapped into this space
  # (version suffix stripped, e.g. ENSG00000001234.2 -> ENSG00000001234)
  # before cross-dataset comparison, since native platform ids
  # (probe/Entrez/etc.) otherwise never match across datasets. Also
  # passed through unchanged to preprocessing_script (mode 2). A dataset
  # missing this (or pointed at a nonexistent column) keeps its native
  # ids while every successfully-mapped dataset becomes Ensembl, so
  # cross-dataset comparisons against it intersect on ~nothing -- surfaces
  # as projectR's "0 row names matched between data and loadings" rather
  # than an error, so it's worth verifying this resolves correctly for
  # any dataset involved in cross-dataset work.
  ensembl_col: ensembl

  # Optional, DISPLAY ONLY -- never used for the actual cross-dataset
  # computational matching (see ensembl_col above for that). Names the
  # feature_metadata_path column holding this dataset's gene SYMBOL, for
  # showing recognizable gene names in the app. Without this, the symbol
  # column is GUESSED from a fixed list of common names (symbol/
  # gene_symbol/SYMBOL/Symbol) -- set this explicitly if your feature
  # metadata spells it differently (e.g. gene_name, external_gene_name,
  # hgnc_symbol).
  # symbol_col: gene_name

  # Required only if methods.cp / methods.tucker (tensor decomposition) are
  # configured below -- both columns in sample_metadata_path, used to
  # reshape the standard genes x samples matrix into a genes x subjects x
  # timepoints array. See R/lib/tensors.R::build_tensor().
  # subject_id_col: subject_id
  # timepoint_col: timepoint

  # Mode 2: uncomment to run your own script instead of the default pivot.
  # The script must write file.path(tmp_dir, "matrix.rds"); see R/README.md's
  # "Preprocessing script contract" for the full contract (available
  # variables). Any sample/feature filtering belongs in the script, not as
  # a separate post-hoc id list.
  # preprocessing_script: R/preprocessing/preprocess_sepsis_day0.R

# SLURM resource settings, one entry per method actually configured below
# (network methods nest one level deeper, by backend).
#
# IMPORTANT: write each entry out IN FULL -- do not use YAML anchors/merge
# keys (`&name` + `<<: *name`) here. R's `yaml` package (confirmed against
# the installed version, 2.3.12) does NOT apply override keys that follow
# a `<<:` merge key in the same mapping -- every key after `<<:` is
# silently DROPPED and the anchor's original values win instead. An
# earlier version of this file used anchors for exactly this section and
# every method silently got PCA's container as a result. Verify with
# `yaml::read_yaml()` directly if you're ever unsure a config value is
# actually taking effect.
slurm:
  pca:
    mem: 4G
    cpus_per_task: 1
    time: "00:30:00"
    container: "/ref/mblab/containers/chasem/tidyverse_latest.sif"
    libPaths: "/ref/mblab/software/chasem/R/4.6.0"
    sh_template: "config/rslurm_templates/submit_sh.txt"
    sh_template_single: "config/rslurm_templates/submit_single_sh.txt"
    rscript_path: "Rscript"
  nmf:
    mem: 8G
    cpus_per_task: 1
    time: "01:00:00"
    container: "/ref/mblab/containers/chasem/tidyverse_latest.sif"
    libPaths: "/ref/mblab/software/chasem/R/4.6.0"
    sh_template: "config/rslurm_templates/submit_sh.txt"
    sh_template_single: "config/rslurm_templates/submit_single_sh.txt"
    rscript_path: "Rscript"
  cogaps:
    mem: 30G
    cpus_per_task: 10   # also passed through as CoGAPS's distributed nSets / CoGAPS()'s nThreads, unless overridden under methods.cogaps.distributed_params/run
    time: "12:00:00"
    container: "/ref/mblab/containers/chasem/cogaps_sha-3b3e002.sif"
    libPaths: "/ref/mblab/software/chasem/R/4.6.0"
    sh_template: "config/rslurm_templates/submit_sh.txt"
    sh_template_single: "config/rslurm_templates/submit_single_sh.txt"
    rscript_path: "Rscript"
  spca:
    mem: 4G
    cpus_per_task: 1
    time: "02:00:00"
    container: "/ref/mblab/containers/chasem/r-elasticnet_1.3--81dc98c2fe6e7ac6.sif"
    libPaths: "/ref/mblab/software/chasem/R/4.6.0"
    sh_template: "config/rslurm_templates/submit_sh.txt"
    sh_template_single: "config/rslurm_templates/submit_single_sh.txt"
    rscript_path: "/opt/conda/bin/Rscript"
  ica:
    mem: 4G
    cpus_per_task: 1
    time: "02:00:00"
