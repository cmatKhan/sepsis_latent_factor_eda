# Resource specs for the ingest slurm pipeline's job families -- see
# R/create_ingest_slurm_bundle.R. Two containers: ingest_core/fgsea share
# one image (CoGAPS transitively pulls in fgsea, so listing CoGAPS in
# `pkgs` is enough for both); gprofiler is separate (needs network egress
# to g:Profiler's API, unlike everything else here). projectr/driver need
# the user's local projectR fork installed (devtools::install_local()), not
# a Bioconductor/CRAN release -- see R/README.md's container notes -- and
# both point at sepsis_timecourse_factors_eda.sif, built from this repo's
# own Dockerfile (see its header). That image is actually a superset
# covering every job family's packages here (DBI/RSQLite/arrow/yaml/
# CoGAPS/clue/matrixStats/fgsea/BiocParallel/gprofiler2/msigdbr/projectR
# all in one), so it could replace ingest_core/fgsea/gprofiler's images
# too if you'd rather manage one image than three -- not done here since
# those three were separately verified working (see ingest_core's own
# comment below) and switching them isn't necessary just for projectR.

ingest_core:
  mem: 16G
  cpus_per_task: 1        # single SQLite writer -- no benefit from more
  time: "04:00:00"
  # verified 2026-09-15: DBI/RSQLite/arrow/yaml/CoGAPS/clue/matrixStats/
  # BiocParallel/fgsea/DESeq2/msigdbr all import cleanly inside this image
  # (see config/rslurm_templates/submit_sh.txt's env-leak fix -- without
  # it, everything but DBI/matrixStats/BiocParallel falsely appeared
  # missing due to a leaked host R_LIBS_USER).
  # NOT YET VERIFIED in this image: `projectR` (the user's local fork) --
  # added as a NEW requirement 2026-09-16 when run_all_pattern_drivers()
  # (R/lib/ingest/driver.R, projectionDriveR()-based differential-feature
  # identification) was wired into ingest_one_dataset(), which now runs
  # inside ingest_core itself. Rebuild/re-verify this image before relying
  # on it for a real ingest_core run.
  container: "/ref/mblab/containers/chasem/bioconductor-biocparallel_bioconductor-cogaps_bioconductor-deseq2_bioconductor-fgsea_pruned_e7b1731bd8833692.sif"
  libPaths: "/ref/mblab/software/chasem/R/4.6.0"
  sh_template: "config/rslurm_templates/submit_sh.txt"
  sh_template_single: "config/rslurm_templates/submit_single_sh.txt"
  rscript_path: "/opt/conda/bin/Rscript"

fgsea:
  mem: 8G
  cpus_per_task: 8         # BiocParallel workers within each array task
  time: "02:00:00"
  container: "/ref/mblab/containers/chasem/bioconductor-biocparallel_bioconductor-cogaps_bioconductor-deseq2_bioconductor-fgsea_pruned_e7b1731bd8833692.sif"
  libPaths: "/ref/mblab/software/chasem/R/4.6.0"
  sh_template: "config/rslurm_templates/submit_sh.txt"
  sh_template_single: "config/rslurm_templates/submit_single_sh.txt"
  rscript_path: "/opt/conda/bin/Rscript"

gprofiler:
  mem: 4G
  cpus_per_task: 1          # deliberately serial -- g:Profiler API, not compute-bound
  time: "08:00:00"
  # verified 2026-09-15: arrow/gprofiler2 import cleanly, and a live
  # gost() call succeeded (network egress confirmed) -- see
  # config/rslurm_templates/submit_sh.txt's env-leak fix, same as
  # ingest_core/fgsea's image
  container: "/ref/mblab/containers/chasem/r-arrow_r-gprofiler2_b4673b4475a66970.sif"
  libPaths: "/ref/mblab/software/chasem/R/4.6.0"
  sh_template: "config/rslurm_templates/submit_sh.txt"
  sh_template_single: "config/rslurm_templates/submit_single_sh.txt"
  rscript_path: "/opt/conda/bin/Rscript"

projectr:
  mem: 4G
  cpus_per_task: 1
  time: "01:00:00"
  # Built from this repo's Dockerfile (rocker/tidyverse base + projectR
  # installed from the local fork via BuildKit's --build-context -- see
  # Dockerfile's own header) -- superset image covering every ingest job
  # family's packages, including DBI/RSQLite/arrow/projectR needed here.
  container: "/ref/mblab/containers/chasem/sepsis_timecourse_factors_eda.sif"
  libPaths: "/ref/mblab/software/chasem/R/4.6.0"
  sh_template: "config/rslurm_templates/submit_sh.txt"
  sh_template_single: "config/rslurm_templates/submit_single_sh.txt"
  rscript_path: "Rscript"

driver:
  mem: 8G
  cpus_per_task: 1
  # Split out of ingest_core (see R/ingest_jobs/driver_job.R's header) --
  # projectR::projectionDriveR() needs the same image as
  # projectr_within/cross_grid above, not ingest_core's
  # bioconductor-cogaps/fgsea/deseq2 image (which has no projectR). One
  # single (non-array) job looping every dataset x representative fit x
  # small-categorical-column combination sequentially -- generous time
  # budget since the combinatorial pass (see run_all_pattern_drivers())
  # scales with dataset count and categorical-column cardinality.
  time: "04:00:00"
  container: "/ref/mblab/containers/chasem/sepsis_timecourse_factors_eda.sif"
  libPaths: "/ref/mblab/software/chasem/R/4.6.0"
  sh_template: "config/rslurm_templates/submit_sh.txt"
  sh_template_single: "config/rslurm_templates/submit_single_sh.txt"
  rscript_path: "Rscript"
