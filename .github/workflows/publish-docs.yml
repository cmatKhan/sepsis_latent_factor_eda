# Renders the Quarto site in docs/ and publishes it to the gh-pages branch
# (https://cmatkhan.github.io/sepsis_latent_factor_eda/). The site is static (no
# executable chunks); the only R it needs is roxygen2, which docs/build_reference.R
# uses to build the function reference from the code's comments.
#
# One-time setup: create the gh-pages branch with `quarto publish gh-pages docs`
# from a machine that has R and roxygen2, then set Settings > Pages > Source to
# the gh-pages branch.
name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "R/**"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install roxygen2
        run: Rscript -e 'install.packages("roxygen2")'

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
