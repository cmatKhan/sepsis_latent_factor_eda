# Resource specs for the ingest slurm pipeline's job families -- see
# R/create_ingest_slurm_bundle.R. ingest_core/fgsea/projectr/driver all now
# point at sepsis_timecourse_factors_eda.sif, built from this repo's own
# Dockerfile (see its header) -- a superset image covering every job
# family's packages here (DBI/RSQLite/arrow/yaml/CoGAPS/clue/matrixStats/
# mclust/fgsea/BiocParallel/gprofiler2/msigdbr/projectR all in one).
# Switched ingest_core/fgsea onto it 2026-09-17 after discovering the old
# separately-maintained bioconductor-pruned image (still referenced
# nowhere now, formerly bioconductor-biocparallel_bioconductor-cogaps_
# bioconductor-deseq2_bioconductor-fgsea_pruned_e7b1731bd8833692.sif) was
# NEVER verified to have `mclust` -- confirmed missing when
# compute_wgcna_pairs()'s mclust::adjustedRandIndex() call (R/lib/ingest/
# pairs.R) failed mid-ingest_core run ("there is no package called
# 'mclust'"). A full audit of every pkg::fn() call actually reachable from
# ingest_core's/fgsea_grid's code (db.R, similarity.R, extract.R, pairs.R,
# redundancy.R, ingest_dataset.R, ingest_core_job.R, fgsea_job.R) found
# mclust to be the ONLY gap -- everything else those two touch (DBI,
# RSQLite, yaml, CoGAPS, clue, fgsea, BiocParallel; utils is base R) was
# already confirmed present. Consolidating onto the one already-built,
# already-audited image avoids relying on a second, separately-maintained
# image ever silently drifting out of sync like this again. gprofiler
# stays on its own separate, smaller image (needs network egress to
# g:Profiler's API, unlike everything else here, so keeping it minimal /
# least-privilege is worth the extra image).

ingest_core:
  mem: 30G
  cpus_per_task: 1        # single SQLite writer -- no benefit from more
  time: "10:00:00"
  container: "/ref/mblab/containers/chasem/sepsis_timecourse_factors_eda.sif"
  libPaths: "/ref/mblab/software/chasem/R/4.6.0"
  sh_template: "config/rslurm_templates/submit_sh.txt"
  sh_template_single: "config/rslurm_templates/submit_single_sh.txt"
  rscript_path: "Rscript"

fgsea:
  mem: 8G
  cpus_per_task: 8         # BiocParallel workers within each array task
  time: "02:00:00"
  container: "/ref/mblab/containers/chasem/sepsis_timecourse_factors_eda.sif"
  libPaths: "/ref/mblab/software/chasem/R/4.6.0"
  sh_template: "config/rslurm_templates/submit_sh.txt"
  sh_template_single: "config/rslurm_templates/submit_single_sh.txt"
  rscript_path: "Rscript"

gprofiler:
  mem: 4G
  cpus_per_task: 1          # deliberately serial -- g:Profiler API, not compute-bound
  time: "08:00:00"
  # verified 2026-09-15: arrow/gprofiler2 import cleanly, and a live
  # gost() call succeeded (network egress confirmed) -- see
  # config/rslurm_templates/submit_sh.txt's env-leak fix, same as
  # ingest_core/fgsea's image
  container: "/ref/mblab/containers/chasem/r-arrow_r-gprofiler2_b4673b4475a66970.sif"
  libPaths: "/ref/mblab/software/chasem/R/4.6.0"
  sh_template: "config/rslurm_templates/submit_sh.txt"
  sh_template_single: "config/rslurm_templates/submit_single_sh.txt"
  rscript_path: "/opt/conda/bin/Rscript"

projectr:
  mem: 4G
  cpus_per_task: 1
  time: "01:00:00"
  # Built from this repo's Dockerfile (rocker/tidyverse base + projectR
  # installed from the local fork via BuildKit's --build-context -- see
  # Dockerfile's own header) -- superset image covering every ingest job
  # family's packages, including DBI/RSQLite/arrow/projectR needed here.
  container: "/ref/mblab/containers/chasem/sepsis_timecourse_factors_eda.sif"
  libPaths: "/ref/mblab/software/chasem/R/4.6.0"
  sh_template: "config/rslurm_templates/submit_sh.txt"
  sh_template_single: "config/rslurm_templates/submit_single_sh.txt"
  rscript_path: "Rscript"

driver:
  mem: 8G
  cpus_per_task: 1
  # Split out of ingest_core (see R/ingest_jobs/driver_job.R's header) --
  # projectR::projectionDriveR() needs the same image as
  # projectr_within/cross_grid above, not ingest_core's
  # bioconductor-cogaps/fgsea/deseq2 image (which has no projectR). One
  # single (non-array) job looping every dataset x representative fit x
  # small-categorical-column combination sequentially -- generous time
  # budget since the combinatorial pass (see run_all_pattern_drivers())
  # scales with dataset count and categorical-column cardinality.
  time: "04:00:00"
  container: "/ref/mblab/containers/chasem/sepsis_timecourse_factors_eda.sif"
  libPaths: "/ref/mblab/software/chasem/R/4.6.0"
  sh_template: "config/rslurm_templates/submit_sh.txt"
  sh_template_single: "config/rslurm_templates/submit_single_sh.txt"
  rscript_path: "Rscript"
